name: Sync Design System & Build Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [supernova-release]

concurrency:
  group: design-system-main
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Sync, Generate, and Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Exporter
        run: npm run build:exporter

      - name: Verify committed exporter bundle
        run: git diff --exit-code -- exporter/dist/index.js

      - name: Generate Components & Sync Tokens
        run: npm run generate

      - name: Build Packages (React, Svelte, Tokens)
        run: npm run build:packages

      # Project Pages site is served from https://dwlhm.github.io/supernova/
      - name: Build Documentation Site
        env:
          BASE_URL: /supernova/
        run: npm run docs:build

      - name: Automated Version Bump & Git Commit
        id: versioning
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Naikkan patch version otomatis untuk seluruh packages
          npm version patch --workspaces --no-git-tag-version

          NEW_VERSION=$(node -p "require('./packages/tokens/package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

          git add packages/ docs/
          git commit -m "chore(release): update design system artifacts v$NEW_VERSION [skip ci]" || echo "No changes to commit"
          if git rev-parse -q --verify "refs/tags/v$NEW_VERSION" >/dev/null; then
            echo "Tag v$NEW_VERSION already exists; skipping tag creation."
          else
            git tag "v$NEW_VERSION"
          fi
          git push origin main --tags

      - name: Upload Docs Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # =========================================================================
      # FLOW PUBLISH KE NPM (DINONAKTIFKAN SEMENTARA - DIKOMENTAR DULU)
      # =========================================================================
      # Uncomment blok di bawah ini saat sudah siap mem-publish package ke NPM:
      #
      # - name: Publish to NPM Registry
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      #   run: |
      #     npm publish --workspaces --access public
      # =========================================================================
