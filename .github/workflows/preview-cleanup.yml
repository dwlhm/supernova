name: Cleanup Closed PR Preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: pages-preview-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-preview:
    name: Cleanup Closed PR Preview
    runs-on: ubuntu-latest
    steps:
      - name: Remove PR preview directory from gh-pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.number }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages-clean || exit 0
          cd gh-pages-clean
          if [ -d "pr-preview/pr-${PR_NUM}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -rf "pr-preview/pr-${PR_NUM}"
            git commit -m "chore(preview): remove preview for closed PR #${PR_NUM}"
            git push origin gh-pages
          fi
