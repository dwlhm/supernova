name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: make check

      - name: Build Multi-Framework UI Preview (apps/docs)
        run: pnpm --dir apps/docs build

      - name: Upload UI Preview Bundle
        uses: actions/upload-artifact@v4
        with:
          name: supernova-ui-preview
          path: apps/docs/.vitepress/dist
          retention-days: 14

      - name: Security audit (apps/api)
        run: cd apps/api && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
