name: "PR 2: Sync Templates & Create Confirmation PR"

on:
  push:
    branches: [main]
    paths:
      - 'tokens/**'
      - 'components.catalog.json'
      - 'components.composition.json'
      - 'scripts/component-composition.js'
      - 'scripts/figma-snapshot.js'
      - 'scripts/cache-figma-file.js'
      - 'scripts/figma-to-mitosis.js'
      - 'scripts/process-pr-components.js'
      - 'scripts/import-figma-components.js'
      - 'scripts/generate-components.js'
      - 'scripts/generate-docs.js'
      - 'scripts/export-source.js'
      - 'scripts/sync-tokens.js'
  workflow_dispatch:

concurrency:
  group: template-sync-pr
  cancel-in-progress: true

jobs:
  sync-templates-and-create-pr:
    name: Sync Templates & Create Confirmation PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Import or sync components
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          npm run generate:tokens
          if [ -n "$FIGMA_ACCESS_TOKEN" ]; then
            echo "FIGMA_ACCESS_TOKEN detected. Running figma:sync..."
            npm run figma:sync
          else
            echo "No FIGMA_ACCESS_TOKEN detected. Falling back to sync:components..."
            npm run sync:components
          fi

      - name: Generate documentation
        run: npm run generate:docs

      - name: Detect changes and create/update confirmation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain components/ docs/ .components-manifest.json components.catalog.json)" ]; then
            echo "Changes detected in components, docs, or manifests."

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            # Create or reset branch chore/sync-templates-and-packages to current HEAD
            git checkout -B chore/sync-templates-and-packages

            # Stage modified, untracked, and deleted files in target paths
            git add -A components/ docs/ .components-manifest.json components.catalog.json

            git commit -m "chore(components): sync latest templates and catalog [skip ci]"
            git push origin chore/sync-templates-and-packages --force

            PR_TITLE="chore(components): konfirmasi template terbaru dan katalog komponen"
            PR_BODY=$(cat << 'EOF'
          ## 🤖 Automated Component Template Sync (PR 2)

          Pembaruan token, katalog, kontrak composition, atau skrip generator telah dideteksi di `main`.
          Workflow ini menyinkronkan template universal Mitosis dan dokumentasi sesuai fingerprint desain dan kontrak. Template dengan fingerprint yang tidak berubah tetap dipertahankan.

          Multi-framework packages (`@dwlhm/ui-react`, `@dwlhm/ui-vue`, `@dwlhm/ui-svelte`, `@dwlhm/ui-vue2`) tidak disertakan dalam PR ini, melainkan akan dikompilasi dan dirilis secara otomatis saat PR ini di-merge ke `main` melalui workflow `design-system-ci.yml`.

          ### 📦 Ringkasan Perubahan
          - **Mitosis Templates**: `components/*.lite.tsx`
          - **Documentation & Manifests**:
            - `docs/components/` & `docs/.vitepress/components.generated.json`
            - `.components-manifest.json`
            - `components.catalog.json`

          ### 🔍 Langkah Konfirmasi Maintainer
          1. Tinjau diff template Mitosis dan dokumentasi pada tab **Files changed**.
          2. Pastikan properti variant, token binding, dan kode kustom sesuai dengan spesifikasi desain terbaru.
          3. Setelah disetujui, lakukan **Merge Pull Request** ke branch `main`.
          4. Penggabungan ke `main` akan memicu workflow `Sync Design System & Build Packages` (`design-system-ci.yml`) untuk kompilasi multi-framework package, bump version, tagging rilis, dan deployment dokumentasi.
          EOF
          )

            EXISTING_PR=$(gh pr list --head chore/sync-templates-and-packages --base main --state open --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
              echo "Existing open PR #$EXISTING_PR found. Updating PR..."
              gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
              echo "PR #$EXISTING_PR updated successfully."
            else
              echo "No existing open PR found. Creating new PR..."
              gh pr create --head chore/sync-templates-and-packages --base main --title "$PR_TITLE" --body "$PR_BODY"
              echo "New PR created successfully."
            fi
          else
            echo "No component, docs, or manifest drift detected. Skipping PR creation."
          fi
