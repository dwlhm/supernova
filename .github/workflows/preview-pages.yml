name: UI Preview (GitHub Pages)

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    name: Build & Deploy Live UI Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build compiler package
        run: pnpm --filter @komerce-design/mitosis-compiler build

      - name: Compute Preview Base & Destination
        id: meta
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.number }}"
            echo "vitepress_base=/${REPO_NAME}/pr-preview/pr-${PR_NUM}/" >> "$GITHUB_OUTPUT"
            echo "dest_dir=pr-preview/pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
            echo "preview_url=https://${OWNER}.github.io/${REPO_NAME}/pr-preview/pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
          else
            echo "vitepress_base=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
            echo "dest_dir=." >> "$GITHUB_OUTPUT"
            echo "preview_url=https://${OWNER}.github.io/${REPO_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Multi-Framework UI Preview (VitePress)
        env:
          VITEPRESS_BASE: ${{ steps.meta.outputs.vitepress_base }}
        run: pnpm --dir apps/docs build

      - name: Ensure .nojekyll in bundle
        run: touch apps/docs/.vitepress/dist/.nojekyll

      - name: Deploy Live Preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/docs/.vitepress/dist
          destination_dir: ${{ steps.meta.outputs.dest_dir }}
          keep_files: true

      - name: Post or Update PR Comment with Live UI Preview Links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.meta.outputs.preview_url }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- komerce-design-ui-preview-comment -->';
            const previewUrl = process.env.PREVIEW_URL;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const branch = context.payload.pull_request.head.ref;
            const { owner, repo } = context.repo;
            const repoUrl = `https://github.com/${owner}/${repo}`;

            function toKebab(str) {
              return str
                .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
                .replace(/([A-Z]+)([A-Z][a-z])/g, '$1-$2')
                .toLowerCase();
            }

            const compDirs = ['src/components', 'src/icons'];
            const comps = [];
            for (const dir of compDirs) {
              if (fs.existsSync(dir)) {
                for (const file of fs.readdirSync(dir)) {
                  if (file.endsWith('.lite.tsx')) {
                    const name = file.slice(0, -'.lite.tsx'.length);
                    const slug = toKebab(name);
                    comps.push({ name, slug, dir });
                  }
                }
              }
            }
            comps.sort((a, b) => a.name.localeCompare(b.name));

            const quickLinks = comps.map(
              (c) => `[**${c.name}** ↗](${previewUrl}/components/${c.slug})`
            );

            const body = [
              marker,
              '### 🚀 Komerce Design Live UI Preview Ready!',
              '',
              `Komponen Mitosis pada PR ini (\`${sha}\`) telah dikompilasi ke **React**, **Vue 3**, dan **Svelte** serta di-deploy ke GitHub Pages:`,
              '',
              '| Halaman Preview | Deskripsi | Link Langsung |',
              '| :--- | :--- | :--- |',
              `| 🎨 **Multi-Framework Showcase** | Preview dashboard & side-by-side (**React · Vue 3 · Svelte**) | [**Buka Live Showcase ↗**](${previewUrl}/showcase) |`,
              `| 🧩 **Component Catalog** | Katalog interaktif **${comps.length} komponen** (Light/Dark & Variants) | [**Buka Component Catalog ↗**](${previewUrl}/components/) |`,
              `| 🎛️ **Design Tokens Reference** | Dokumentasi visual design tokens (\`theme.css\` & \`tokens.css\`) | [**Buka Design Tokens ↗**](${previewUrl}/tokens) |`,
              '',
              ...(quickLinks.length > 0
                ? [
                    `#### ⚡ Pintasan Langsung per Komponen (${comps.length} Komponen — Tinggal Klik)`,
                    '',
                    quickLinks.join(' · '),
                    '',
                  ]
                : []),
              '> 💡 *Tip: Gunakan komentar `/komerce regenerate <NamaKomponen>: <catatan>` di PR ini untuk merevisi komponen secara otomatis.*'
            ].join('\n');

            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
