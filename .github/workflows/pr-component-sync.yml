name: "PR 1: Token Validation & CI Check"

on:
  pull_request:
    branches: [main]
    paths:
      - 'tokens/**'
      - 'components.catalog.json'

concurrency:
  group: pr-token-validation-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-tokens:
    name: Token Validation & CI Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate tokens
        run: npm run test:exporter

      - name: Test building tokens & packages
        run: |
          npm run generate:tokens
          npm run build:packages
